name: Deploy Learn Angle to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare Python image build
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/branding-requirements.txt
      - name: Install CJK fonts for social thumbnails
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: Generate raster icons and share previews
        run: |
          python -m pip install -r scripts/branding-requirements.txt
          python scripts/build-brand-assets.py
      - name: Check app syntax and UI links
        run: |
          node --check app.js
          node --check sw.js
          node --check scripts/update-exams.mjs
          node --check scripts/update-admission.mjs
          node scripts/update-exams.mjs --selftest
          node scripts/validate.cjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
